<header class="site-header">
  <button class="menu-toggle glass" id="menu-toggle" type="button"
          aria-label="Toggle menu" aria-expanded="false" aria-controls="site-menu">
    <img class="icon-burger" src="https://cdn-icons-png.flaticon.com/128/63/63000.png" alt="">
    <img class="icon-close" src="https://cdn-icons-png.flaticon.com/128/7546/7546863.png" alt="">
  </button>
</header>

<div class="backdrop" id="menu-backdrop" hidden></div>

<nav class="menu" id="site-menu" aria-label="Site menu">
  <a href="#" data-action="search">
    <img src="https://cdn-icons-png.flaticon.com/128/751/751463.png" alt="">Search
  </a>
  <a href="{{ '/' | relative_url }}#tags">
    <img src="https://cdn-icons-png.flaticon.com/128/2767/2767192.png" alt="">Tags
  </a>
  <a href="https://github.com/{{ site.github_username }}/ramani/blob/main/README.md" target="_blank" rel="noopener">
    <img src="https://cdn-icons-png.flaticon.com/128/2767/2767192.png" alt="">README
  </a>
  <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">
    <img src="https://cdn-icons-png.flaticon.com/128/25/25471.png" alt="">GitHub
  </a>
</nav>

<script>
(function () {
  'use strict';
  var toggle = document.getElementById('menu-toggle');
  var menu = document.getElementById('site-menu');
  var backdrop = document.getElementById('menu-backdrop');
  if (!toggle || !menu) return;

  function setMenu(open) {
    document.body.classList.toggle('menu-open', open);
    menu.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      backdrop.hidden = false;
      requestAnimationFrame(function () { backdrop.classList.add('open'); });
    } else {
      backdrop.classList.remove('open');
      setTimeout(function () {
        if (!document.body.classList.contains('menu-open')) backdrop.hidden = true;
      }, 360);
    }
  }

  toggle.addEventListener('click', function () {
    setMenu(!document.body.classList.contains('menu-open'));
  });
  backdrop.addEventListener('click', function () { setMenu(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      setMenu(false);
      document.dispatchEvent(new CustomEvent('ramani:close-search'));
    }
  });

  var searchItem = menu.querySelector('[data-action="search"]');
  if (searchItem) {
    searchItem.addEventListener('click', function (e) {
      e.preventDefault();
      setMenu(false);
      document.dispatchEvent(new CustomEvent('ramani:open-search'));
    });
  }
})();
</script>
