      </li>
      <li>

    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
      <svg class="theme-icon" data-when="system" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="9" rx="1" stroke="currentColor" stroke-width="1.2"></rect>
        <path d="M6 14h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
      </svg>
      <svg class="theme-icon" data-when="light" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.2"></circle>
        <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M12.95 3.05l-1.13 1.13M4.18 11.82l-1.13 1.13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
      </svg>
      <svg class="theme-icon" data-when="dark" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.5 9.6A6 6 0 0 1 6.4 2.5a6 6 0 1 0 7.1 7.1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path>
      </svg>
    </button>

    <button class="menu-toggle" id="menu-toggle" type="button"
            aria-label="Toggle menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span>
    </button>
  </div>
</header>

<div class="sheet" id="site-menu" data-open="false">
  <div class="sheet-inner">
    <nav aria-label="Site menu">
      <ul>
        <li>
          <a href="{{ '/' | relative_url }}" data-nav="index">
            <span class="nav-icon nav-icon-index" aria-hidden="true"></span>
            <span class="nav-index">[1]</span><span>index</span>
          </a>
        </li>
        <li>
          <a href="{{ '/tags/' | relative_url }}">
            <span class="nav-icon nav-icon-tags" aria-hidden="true"></span>
            <span class="nav-index">[2]</span><span>tags</span>
          </a>
        </li>
        <li>
          <a href="#" data-action="search">
            <span class="nav-icon nav-icon-search" aria-hidden="true"></span>
            <span class="nav-index">[3]</span><span>search</span>
          </a>
        </li>
        <li>
          <a href="#" data-action="palette" aria-keyshortcuts="Meta+K Control+K">
            <span class="nav-key" aria-hidden="true">&#8984;</span>
            <span class="nav-index">[4]</span><span>cmd+k</span>
          </a>
        </li>
        <li>
          <a href="https://github.com/{{ site.github_username }}/ramani/blob/main/README.md" target="_blank" rel="noopener">
            <span class="nav-icon nav-icon-readme" aria-hidden="true"></span>
            <span class="nav-index">[5]</span><span>readme</span>
            <svg class="nav-external" width="6" height="6" viewBox="0 0 6 6" fill="none" aria-hidden="true"><path d="M0 0.5H5.5V6M5.5 0.5L0.25 5.75" stroke="currentColor"></path></svg>
          </a>
        </li>
        <li>
          <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">
            <span class="nav-icon nav-icon-github" aria-hidden="true"></span>
            <span class="nav-index">[6]</span><span>github</span>
            <svg class="nav-external" width="6" height="6" viewBox="0 0 6 6" fill="none" aria-hidden="true"><path d="M0 0.5H5.5V6M5.5 0.5L0.25 5.75" stroke="currentColor"></path></svg>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- theme: system -> light -> dark ---------- */
  var root = document.documentElement;
  var toggle = document.getElementById('theme-toggle');
  var order = ['system', 'light', 'dark'];

  function label(t) {
    return t === 'system' ? 'system preference' : t;
  }
  function apply(t) {
    if (order.indexOf(t) === -1) t = 'system';
    root.dataset.theme = t;
    try { localStorage.setItem('ramani-theme', t); } catch (e) {}
    if (!toggle) return;
    var next = order[(order.indexOf(t) + 1) % order.length];
    toggle.setAttribute('aria-label', 'Theme: ' + label(t) + '. Switch to ' + label(next) + '.');
    toggle.setAttribute('title', 'theme: ' + label(t));
  }

  if (toggle) {
    apply(root.dataset.theme || 'system');
    toggle.addEventListener('click', function () {
      var now = root.dataset.theme || 'system';
      apply(order[(order.indexOf(now) + 1) % order.length]);
    });
  }

  /* ---------- mobile sheet ---------- */
  var burger = document.getElementById('menu-toggle');
  var sheet = document.getElementById('site-menu');
  if (!burger || !sheet) return;

  function setMenu(open) {
    sheet.dataset.open = open ? 'true' : 'false';
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.style.overflow = open ? 'hidden' : '';
  }

  burger.addEventListener('click', function () {
    setMenu(sheet.dataset.open !== 'true');
  });

  sheet.addEventListener('click', function (e) {
    if (e.target.closest('a')) setMenu(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      setMenu(false);
      document.dispatchEvent(new CustomEvent('ramani:close-search'));
    }
  });

  var searchLinks = document.querySelectorAll('[data-action="search"]');
  Array.prototype.forEach.call(searchLinks, function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      setMenu(false);
      document.dispatchEvent(new CustomEvent('ramani:open-search'));
    });
  });
})();
</script>
