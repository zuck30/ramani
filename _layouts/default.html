<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    var t;
    try { t = localStorage.getItem('ramani-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'system';
    document.documentElement.dataset.theme = t;
  })();
  </script>
  <meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/nav-logo.png' | relative_url }}" type="image/png" sizes="128x128">
  <link rel="alternate" type="application/atom+xml" title="ramani" href="{{ '/feed.xml' | relative_url }}">
  {% if site.chat.endpoint and site.chat.endpoint != "" %}
  <meta name="ramani-chat-endpoint" content="{{ site.chat.endpoint }}">
  <meta name="ramani-chat-key" content="{{ site.chat.key }}">
  {% endif %}
  {% seo %}
</head>
<body>

  <a class="skip-link" href="#content">Skip to content</a>

  {% include header.html %}

  <div class="site-frame">
    <main class="wrap {{ page.body_class }}" id="content" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </div>

  <script src="{{ '/assets/js/scroll-jump.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/chat.js' | relative_url }}" defer></script>

</body>
</html>
